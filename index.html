  <main class="app">
    <h1 class="app__title">˚₊‧꒰ა <span class="app__title-letter">D</span><span class="app__title-letter">o</span><span class="app__title-letter">l</span><span class="app__title-letter">l</span><span class="app__title-letter">z</span> ໒꒱ ‧₊˚</h1>

    <div class="panel panel--stage">
      <canvas class="stage__canvas" id="stage" role="img" aria-label="Your doll"></canvas>
      <!-- Hidden for now: delete the hidden attribute to bring the button back. -->
      <button class="randomize" id="randomize" type="button" hidden>
        <svg class="dice" aria-hidden="true" focusable="false"></svg>
        <span class="randomize__label">randomize</span>
      </button>
    </div>

    <section class="panel app__controls" id="controls" aria-label="Customize your doll">
      <div class="tabs" id="tabs" role="tablist" aria-label="Categories"></div>
      <div class="tabpanel" id="tabpanel" role="tabpanel"></div>
    </section>

    <button class="btn app__export" id="export" type="button">Save as PNG</button>

      <span class="hits__digits" id="hits-digits" aria-hidden="true"></span>
    </div>
  </main>

  /* =======================================================================
     COLOR MATH
     ======================================================================= */

  const hexToRgb = hex => {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };

  const mixRgb = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));

  function rgbToHsv([r, g, b]) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0;
    if (d) {
      if (max === r) h = ((g - b) / d) % 6;
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
      if (h < 0) h += 360;
    }
    return [h, max ? d / max : 0, max];
  }

  function hsvToRgb([h, s, v]) {
    const c = v * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = v - c;
    const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x]
                    : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
    return [r, g, b].map(n => Math.round((n + m) * 255));
  }

  function rgbToHsl([r, g, b]) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    const l = (max + min) / 2;
    const [h] = rgbToHsv([r * 255, g * 255, b * 255]);
    const s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
    return [h, s, l];
  }

  function hslToRgb([h, s, l]) {
    const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = l - c / 2;
    const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x]
                    : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
    return [r, g, b].map(n => Math.round(Math.min(1, Math.max(0, n + m)) * 255));
  }

  /* Hair highlight: a lighter, slightly softer version of the base tone. */
  const HAIR_HIGHLIGHT = { lightness: 0.2, saturation: 0.8 };
  const highlightOf = rgb => {
    const [h, sat, l] = rgbToHsl(rgb);
    return hslToRgb([h, sat * HAIR_HIGHLIGHT.saturation, Math.min(1, l + HAIR_HIGHLIGHT.lightness)]);
  };

  /* Hair shadow: a darker version of the base tone (used by the 'long' style). */
  const HAIR_SHADOW_LIGHTNESS = 0.16;
  const shadowOf = rgb => {
    const [h, sat, l] = rgbToHsl(rgb);
    return hslToRgb([h, sat, Math.max(0, l - HAIR_SHADOW_LIGHTNESS)]);
  };

  const darkenValue = (rgb, factor) => {
    const [h, s, v] = rgbToHsv(rgb);
    return hsvToRgb([h, s, v * factor]);
  };

  /* =======================================================================
     STATE + PALETTE
     ======================================================================= */

  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-');
  CONTROLS.forEach(c => (c.options || []).forEach(o => { o.id = o.id || slug(o.name); }));

  /* Defaults on page load. */
  const state = {
    figure:     FIGURES[0].id,
    skin:       'caramel',
    eyestyle:   FIGURES[0].eyeStyles[0].id,
    eyes:       'emerald',
    shadow:     'black',
    shadowOpacity: 50,                 // percent, blended over skin
    lips:       'rose',
    lipOpacity: 80,                    // percent, blended over skin
    clothes:    'match-outline',       // undies & top
    hairstyle:  'short',
    hair:       'espresso',
    brows:      'match-outline',
    shirt:      't-shirt',
    shirtcolor: 'black',
    shirtaccent: 'white',
    shirtunder: 'white',
    shirtdesign: 'monkey',
    pants:      'flares',
    pantscolor: 'denim',
    beltcolor:  'brown',
    shoecolor:  'black'
  };

  const findOption = key => CONTROLS.find(c => c.key === key).options.find(o => o.id === state[key]);

  function resolvePalette() {
    const skinOpt = findOption('skin');
    const skin    = hexToRgb(skinOpt.hex);
    /* Outline = skin value x a factor. A skin option can set its own
       outlineFactor (darker tones need a bigger step to read) or pin an exact outline. */
    const outline = skinOpt.outline
      ? hexToRgb(skinOpt.outline)
      : darkenValue(skin, skinOpt.outlineFactor ?? OUTLINE_VALUE_FACTOR);
    const hairOpt = findOption('hair');
    const hair    = hairOpt.match === 'outline' ? outline : hexToRgb(hairOpt.hex);
    const browOpt = findOption('brows');
    const brow    = browOpt.match === 'outline' ? outline : hexToRgb(browOpt.hex);
    const eye     = findOption('eyes');
    const eyeBase = hexToRgb(eye.hex);
    const eyeShine = eye.shine ? hexToRgb(eye.shine) : mixRgb(eyeBase, [255, 255, 255], 0.4);
    const pantsFill    = hexToRgb(findOption('pantscolor').hex);
    const pantsOutline = darkenValue(pantsFill, PANTS_OUTLINE_FACTOR);

    const shoeFill     = hexToRgb(findOption('shoecolor').hex);
    const shoeOutline  = darkenValue(shoeFill, SHOE_OUTLINE_FACTOR);

    const shirtOpt     = findOption('shirtcolor');
    const shirtFill    = hexToRgb(shirtOpt.hex);
    const shirtOutline = shirtOpt.outline ? hexToRgb(shirtOpt.outline) : darkenValue(shirtFill, SHIRT_OUTLINE_FACTOR);
    const shirtAccent  = hexToRgb(findOption('shirtaccent').hex);
    const shirtUnder   = hexToRgb(findOption('shirtunder').hex);
    const shirtUnderLight = (() => { const [h, sat, l] = rgbToHsl(shirtUnder); return hslToRgb([h, sat * 0.9, Math.min(1, l + 0.12)]); })();
    const shirtLight   = (() => { const [h, sat, l] = rgbToHsl(shirtFill); return hslToRgb([h, sat * 0.9, Math.min(1, l + 0.12)]); })();

    const clothesOpt = findOption('clothes');
    const clothes = clothesOpt.match === 'outline' ? outline : hexToRgb(clothesOpt.hex);

    return {
      S: skin, O: outline, N: outline,           // nose always matches outline
      H: hair, B: brow,                          // brows have their own color now
      V: highlightOf(hair),                      // hair style highlight tone
      D: shadowOf(hair),                         // hair style shadow tone
      L: [0, 0, 0],                              // lashes are fixed black
      E: mixRgb(skin, hexToRgb(findOption('shadow').hex), state.shadowOpacity / 100),
      P: mixRgb(skin, hexToRgb(findOption('lips').hex), state.lipOpacity / 100),
      K: mixRgb(skin, outline, state.lipOpacity / 100),   // smirk: outline color, lip opacity
      I: eyeBase, J: eyeShine, W: [255, 255, 255],
      T: clothes, U: clothes,
      F: shirtFill, X: shirtOutline, M: shirtLight, A: shirtAccent, C: darkenValue(shirtAccent, SHIRT_OUTLINE_FACTOR),
      1: mixRgb(shirtFill, shirtAccent, 1 / 6), 2: mixRgb(shirtFill, shirtAccent, 2 / 6), 3: mixRgb(shirtFill, shirtAccent, 3 / 6),
      4: mixRgb(shirtFill, shirtAccent, 4 / 6), 5: mixRgb(shirtFill, shirtAccent, 5 / 6),     // the Ombre's fade, fill to accent in sixths
      Q: pantsFill, R: pantsOutline,
      Y: shoeFill, Z: shoeOutline,
      c: [255, 249, 189], d: [156, 90, 60], f: [229, 170, 122], g: [237, 28, 36], h: [153, 0, 48],   // the monkey's fixed colors
      u: shirtUnder, v: shirtUnderLight,                          // Puffer: under shirt and its lighter streak
      G: hexToRgb(findOption('beltcolor').hex)
    };
  }

  /* =======================================================================
     RENDER
     ======================================================================= */

  const stageCanvas = document.getElementById('stage');

  /* Draw at 1x into an offscreen canvas, then upscale with no smoothing. */
  function renderTo(canvas, scale) {
    const figure  = FIGURES.find(f => f.id === state.figure);
    const palette = resolvePalette();
    const eyeStyle = figure.eyeStyles.find(e => e.id === state.eyestyle);
    const overrides = new Map(
      eyeStyle.shadow.map(([x, y]) => [x + ',' + y, 'E'])
    );

    const base = document.createElement('canvas');
    base.width = STAGE.w;
    base.height = STAGE.h;
    const bctx = base.getContext('2d');
    const img = bctx.createImageData(STAGE.w, STAGE.h);

    /* (fx, fy) are figure coordinates; the figure's offset places them on the stage. */
    const put = (fx, fy, code, buf = img.data) => {
      const rgb = palette[code];
      if (!rgb) return;
      const sx = fx + figure.offset.x, sy = fy + figure.offset.y;
      if (sx < 0 || sy < 0 || sx >= STAGE.w || sy >= STAGE.h) return;
      const i = (sy * STAGE.w + sx) * 4;
      buf[i] = rgb[0]; buf[i + 1] = rgb[1]; buf[i + 2] = rgb[2]; buf[i + 3] = 255;
    };

    const hairStyle = HAIR_STYLES.find(h => h.id === state.hairstyle);

    figure.rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) put(x, y, overrides.get(x + ',' + y) || row[x]);
    });

    /* Overlays, back to front: pants, shoes, shirt, hair (hair sits in front of everything). */
    const drawOverlay = (overlay, buf) => {
      if (!overlay.rows) return;
      overlay.rows.forEach((row, y) => {
        for (let x = 0; x < row.length; x++) put(overlay.x + x, overlay.y + y, row[x], buf);
      });
    };
    const pantsStyle = PANTS.find(x => x.id === state.pants);
    drawOverlay(pantsStyle);
    if (pantsStyle.shoes) drawOverlay(pantsStyle.shoes);   // shoes sit on top of their pants
    /* The top (with its design) is drawn into its own layer first, then blended over everything
       below at TOP_OPACITY. At 1 that is a plain paint-over; below 1 it turns see-through. */
    const shirtStyle = SHIRTS.find(x => x.id === state.shirt);
    const topLayer = new Uint8ClampedArray(img.data.length);
    drawOverlay(shirtStyle, topLayer);
    if (shirtStyle.designs) drawOverlay(shirtStyle.designs.find(d => d.id === state.shirtdesign) || {}, topLayer);
    for (let i = 0; i < topLayer.length; i += 4) {
      if (!topLayer[i + 3]) continue;
      const a = TOP_OPACITY, below = img.data[i + 3] / 255, outA = a + below * (1 - a);
      for (let k = 0; k < 3; k++) img.data[i + k] = Math.round((topLayer[i + k] * a + img.data[i + k] * below * (1 - a)) / outA);
      img.data[i + 3] = Math.round(outA * 255);
    }
    drawOverlay(hairStyle);
    bctx.putImageData(img, 0, 0);

    canvas.width = STAGE.w * scale;
    canvas.height = STAGE.h * scale;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(base, 0, 0, canvas.width, canvas.height);
  }

  /* Keep the "match outline" swatches in sync with the current skin tone. */
  function syncDerivedColors(palette) {
    const css = rgb => 'rgb(' + rgb.join(',') + ')';
    document.documentElement.style.setProperty('--doll-outline', css(palette.O));
  }

  /* Integer scale keeps every doll pixel the same size on screen. */
  function renderPreview() {
    syncDerivedColors(resolvePalette());
    const dpr = window.devicePixelRatio || 1;
    /* The doll is fitted inside the canvas box, so size her by whichever of its width or height runs out first. */
    const fitted = Math.min(stageCanvas.clientWidth, stageCanvas.clientHeight * STAGE.w / STAGE.h);
    const scale = Math.max(1, Math.floor((fitted * dpr) / STAGE.w));
    renderTo(stageCanvas, scale);
  }

  new ResizeObserver(renderPreview).observe(stageCanvas);

  /* Saved files are named doll_YYYY-MM-DD_HH-MM-SS.png in the viewer's local time,
     so every download gets its own name. */
  function fileName(now = new Date()) {
    const p = n => String(n).padStart(2, '0');
    const date = now.getFullYear() + '-' + p(now.getMonth() + 1) + '-' + p(now.getDate());
    const time = p(now.getHours()) + '-' + p(now.getMinutes()) + '-' + p(now.getSeconds());
    return 'doll_' + date + '_' + time + '.png';
  }

  function exportPng() {
    const out = document.createElement('canvas');
    renderTo(out, EXPORT_SCALE);
    out.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName();
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, 'image/png');
  }

  document.getElementById('export').addEventListener('click', exportPng);

  /* =======================================================================
     CONTROLS (one builder for every group = identical markup)
     ======================================================================= */

  const scrollerEl = document.getElementById('controls');
  const tabsEl     = document.getElementById('tabs');
  const panelEl    = document.getElementById('tabpanel');

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  }

  function syncControl(def, wrap) {
    const current = findOption(def.key);
    wrap.querySelector('.control__value').textContent = current.name;
    wrap.querySelectorAll('[role="radio"]').forEach(btn => {
      btn.setAttribute('aria-checked', String(btn.dataset.id === current.id));
    });
  }

  function buildHead(def) {
    const head  = el('div', 'control__head');
    const label = el('span', 'control__label', typeof def.label === 'function' ? def.label() : def.label);
    const value = el('span', 'control__value');
    label.id = 'label-' + def.key;
    head.append(label, value);
    return { head, label, value };
  }

  function buildRange(def) {
    const wrap = el('div', 'control');
    const { head, label, value } = buildHead(def);
    const input = el('input', 'slider');
    input.type = 'range';
    input.min = def.min;
    input.max = def.max;
    input.step = def.step;
    input.value = state[def.key];
    input.setAttribute('aria-labelledby', label.id);

    const sync = () => { value.textContent = state[def.key] + '%'; };
    input.addEventListener('input', () => {
      state[def.key] = Number(input.value);
      sync();
      renderPreview();
    });

    wrap.append(head, input);
    sync();
    return wrap;
  }

  function buildControl(def) {
    if (def.kind === 'range') return buildRange(def);

    const wrap  = el('div', 'control');
    const { head, label } = buildHead(def);

    const group = el('div', def.kind === 'swatch' ? 'swatch-group' : 'chip-group');
    group.setAttribute('role', 'radiogroup');
    group.setAttribute('aria-labelledby', label.id);

    def.options.filter(o => !o.hidden).forEach(opt => {
      const btn = el('button', def.kind);
      btn.type = 'button';
      btn.setAttribute('role', 'radio');
      btn.dataset.id = opt.id;
      if (def.kind === 'swatch') {
        // only data-driven inline value; match options follow the live skin color
        btn.style.setProperty('--swatch', opt.match ? 'var(--doll-' + opt.match + ')' : opt.hex);
        btn.setAttribute('aria-label', opt.name);
        btn.title = opt.name;
      } else {
        btn.textContent = opt.name;
      }
      btn.addEventListener('click', () => {
        state[def.key] = opt.id;
        if (def.key === 'shirt') {        // picking a top sets its own start colors (black wherever a main color applies)
          const start = currentShirt().colors;
          if (start) { state.shirtcolor = start.fill; if (start.accent) state.shirtaccent = start.accent; if (start.design) state.shirtdesign = start.design; if (start.under) state.shirtunder = start.under; }
        }
        if (CONTROLS.some(c => [].concat(c.dependsOn || []).includes(def.key))) {
          /* Another control's visibility depends on this one: rebuild the panel, keep scroll + focus. */
          renderPanel(true);
          const again = panelEl.querySelector('[aria-labelledby="label-' + def.key + '"] [data-id="' + opt.id + '"]');
          if (again) again.focus();
        } else {
          syncControl(def, wrap);
        }
        renderPreview();
      });
      group.append(btn);
    });

    wrap.append(head, group);
    syncControl(def, wrap);
    return wrap;
  }

  /* ----- Tabs ----- */

  let activeTab = TABS[0].id;

  function renderPanel(keepScroll) {
    const defs = CONTROLS.filter(c => c.tab === activeTab && (!c.showIf || c.showIf()));
    /* A rebuilt chip row would jump back to the start, so remember where it was. */
    const sideways = {};
    panelEl.querySelectorAll('.chip-group').forEach(g => { sideways[g.getAttribute('aria-labelledby')] = g.scrollLeft; });
    panelEl.replaceChildren(
      ...(defs.length ? defs.map(buildControl) : [el('p', 'empty-state', 'Nothing to customize here yet.')])
    );
    panelEl.querySelectorAll('.chip-group').forEach(g => {
      const id = g.getAttribute('aria-labelledby');
      if (keepScroll && id in sideways) g.scrollLeft = sideways[id];
      /* Make sure the chosen chip is in view (after a randomize or a tab switch). */
      const chosen = g.querySelector('[aria-checked="true"]');
      if (chosen && (chosen.offsetLeft < g.scrollLeft || chosen.offsetLeft + chosen.offsetWidth > g.scrollLeft + g.clientWidth)) {
        g.scrollLeft = chosen.offsetLeft - (g.clientWidth - chosen.offsetWidth) / 2;
      }
    });
    if (!keepScroll) scrollerEl.scrollTop = 0;
  }

  function selectTab(id, focus) {
    activeTab = id;
    tabsEl.querySelectorAll('[role="tab"]').forEach(btn => {
      const on = btn.dataset.id === id;
      btn.setAttribute('aria-selected', String(on));
      btn.tabIndex = on ? 0 : -1;
      if (on) {
        panelEl.setAttribute('aria-labelledby', btn.id);
        if (focus) btn.focus();
        btn.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
    });
    renderPanel();
  }

  TABS.forEach(t => {
    const btn = el('button', 'tab', t.label);
    btn.type = 'button';
    btn.id = 'tab-' + t.id;
    btn.dataset.id = t.id;
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-controls', 'tabpanel');
    btn.addEventListener('click', () => selectTab(t.id));
    tabsEl.append(btn);
  });

  /* Arrow keys / Home / End move between tabs (WAI-ARIA tabs pattern). */
  tabsEl.addEventListener('keydown', e => {
    const i = TABS.findIndex(t => t.id === activeTab);
    const next = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: TABS.length - 1 }[e.key];
    if (next === undefined) return;
    e.preventDefault();
    selectTab(TABS[(next + TABS.length) % TABS.length].id, true);
  });

  /* ----- Randomize ----- */

  /* Dice icon: 9 x 14 art pixels. o = outline, w = fill, p = pip. Drawn as SVG rects
     (merged per row) whose colors come from CSS classes, so tokens stay in charge. */
  const DICE = [
    "....o....",
    "...owo...",
    "..owwwo..",
    ".owwwwwo.",
    "owwwpwwwo",
    "oowwwwwoo",
    "opowwwowo",
    "owwowowwo",
    "owppopwwo",
    "oppwowwpo",
    ".owwowwo.",
    "..opowo..",
    "...ooo...",
    "....o...."
  ];

  function buildDice(svg) {
    const NS = 'http://www.w3.org/2000/svg';
    const cls = { o: 'dice__outline', w: 'dice__fill', p: 'dice__pip' };
    svg.setAttribute('viewBox', '0 0 ' + DICE[0].length + ' ' + DICE.length);
    svg.setAttribute('shape-rendering', 'crispEdges');
    DICE.forEach((row, y) => {
      for (let x = 0; x < row.length; ) {
        const ch = row[x];
        if (ch === '.') { x++; continue; }
        let end = x;
        while (end < row.length && row[end] === ch) end++;
        const rect = document.createElementNS(NS, 'rect');
        rect.setAttribute('x', x);
        rect.setAttribute('y', y);
        rect.setAttribute('width', end - x);
        rect.setAttribute('height', 1);
        rect.setAttribute('class', cls[ch]);
        svg.append(rect);
        x = end;
      }
    });
  }

  /* Opacity sliders stay in a range where the feature is still visible. */
  const RANDOM_RANGE = { shadowOpacity: [30, 100], lipOpacity: [50, 100] };
  /* A shirt or pants is always put on, so the random doll looks finished. */
  const RANDOM_SKIP_NONE = ['shirt', 'pants'];

  const pick = list => list[Math.floor(Math.random() * list.length)];

  function randomize() {
    CONTROLS.forEach(def => {
      if (def.kind === 'range') {
        const [lo, hi] = RANDOM_RANGE[def.key] || [def.min, def.max];
        state[def.key] = lo + Math.floor(Math.random() * (hi - lo + 1));
        return;
      }
      let options = def.options.filter(o => !o.hidden);
      if (RANDOM_SKIP_NONE.includes(def.key)) options = options.filter(o => o.id !== 'none');
      state[def.key] = pick(options).id;
    });
    renderPanel(true);   // refresh the visible controls, keep scroll
    renderPreview();
  }

  /* ----- Hit counter -----
     Just for looks: it is not a real counter, and the number never changes. */
  const HIT_COUNT = '6980085';

  function renderHits(text) {
    document.getElementById('hits-digits').replaceChildren(
      ...[...text].map(ch => el('span', 'hits__digit', ch))
    );
    document.getElementById('hits').setAttribute('aria-label', 'Hit counter: ' + text);
  }

  renderHits(HIT_COUNT);

  /* ----- Cursor sparkles and hearts -----
     Pink pixel sparkles and hearts trail the mouse. They are drawn on one full-window canvas (which
     ignores clicks). Sparkles start as a five-pixel plus, shrink to a three-pixel plus and then a
     dot, flicker between pinks and drift down as they fade. Hearts (about one in three) start as
     a five-pixel heart, shrink to the three-pixel heart used in the page background and then a
     dot, keep one pink, and float up. Only mouse and pen move them (not touch), and reduced-motion
     users don't get them. The animation loop runs only while something is on screen. */
  (function sparkleTrail() {
    const canvas = document.getElementById('sparkles');
    if (!canvas || window.matchMedia('(prefers-reduced-motion: reduce)').matches) { if (canvas) canvas.remove(); return; }
    const ctx = canvas.getContext('2d');

    const css = getComputedStyle(document.documentElement);
    const COLORS = ['--color-pink-300', '--color-pink-500', '--color-pink-600', '--color-pink-300'].map(n => css.getPropertyValue(n).trim());
    const PIXEL = 3;                 // css px per sparkle pixel
    const SPACING = 9;               // css px the mouse travels between sparkles
    const MAX = 90;                  // sparkles alive at once
    const SHAPES = {                 // pixel offsets from the center
      big:   [[0,-2],[0,-1],[0,0],[0,1],[0,2],[-2,0],[-1,0],[1,0],[2,0]],
      small: [[0,-1],[0,0],[0,1],[-1,0],[1,0]],
      dot:   [[0,0]],
      heartBig:   [[-1,-2],[1,-2],[-2,-1],[-1,-1],[0,-1],[1,-1],[2,-1],[-2,0],[-1,0],[0,0],[1,0],[2,0],[-1,1],[0,1],[1,1],[0,2]],
      heartSmall: [[-1,-1],[1,-1],[-1,0],[0,0],[1,0],[0,1]]
    };
    const HEART_SHARE = 0.32;        // chance that a new particle is a heart

    let particles = [], running = false, last = 0, lx = null, ly = null, dpr = 1;

    function resize() {
      dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(window.innerWidth * dpr);
      canvas.height = Math.round(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    function spawn(x, y) {
      const n = Math.random() < 0.35 ? 2 : 1;
      for (let i = 0; i < n; i++) {
        const heart = Math.random() < HEART_SHARE;
        particles.push({
          heart,
          x: x + (Math.random() - 0.5) * 14, y: y + (Math.random() - 0.5) * 14,
          vx: (Math.random() - 0.5) * 22,                                  // px per second
          vy: heart ? -(8 + Math.random() * 18) : 6 + Math.random() * 26,   // hearts float up, sparkles sink
          born: performance.now(), life: heart ? 800 + Math.random() * 500 : 550 + Math.random() * 450,
          tint: Math.floor(Math.random() * COLORS.length)
        });
      }
      if (particles.length > MAX) particles.splice(0, particles.length - MAX);
      if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); }
    }

    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      particles = particles.filter(p => now - p.born < p.life);
      particles.forEach(p => {
        p.x += p.vx * dt; p.y += p.vy * dt;
        const age = (now - p.born) / p.life;
        const shape = p.heart
          ? (age < 0.45 ? SHAPES.heartBig : age < 0.8 ? SHAPES.heartSmall : SHAPES.dot)
          : (age < 0.4 ? SHAPES.big : age < 0.75 ? SHAPES.small : SHAPES.dot);
        ctx.fillStyle = COLORS[p.heart ? p.tint : (p.tint + Math.floor(now / 90)) % COLORS.length];   // sparkles flicker, hearts hold their pink
        const cx = Math.round(p.x / PIXEL) * PIXEL, cy = Math.round(p.y / PIXEL) * PIXEL;
        shape.forEach(([dx, dy]) => ctx.fillRect(cx + dx * PIXEL, cy + dy * PIXEL, PIXEL, PIXEL));
      });
      if (particles.length) requestAnimationFrame(frame);
      else { running = false; ctx.clearRect(0, 0, window.innerWidth, window.innerHeight); }
    }

    window.addEventListener('pointermove', e => {
      if (e.pointerType === 'touch') return;
      if (lx === null || Math.hypot(e.clientX - lx, e.clientY - ly) >= SPACING) {
        spawn(e.clientX, e.clientY); lx = e.clientX; ly = e.clientY;
      }
    }, { passive: true });
    document.addEventListener('pointerleave', () => { lx = null; ly = null; });
  })();

  buildDice(document.querySelector('#randomize .dice'));
  document.getElementById('randomize').addEventListener('click', randomize);

  selectTab(activeTab);
  renderPreview();
  </script>
</body>
</html>
